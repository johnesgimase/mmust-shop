<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMUST SHOP</title>
    <style>
        /* Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
        }

        /* Header & Navigation */
        header {
            background-color: #b6afbc; /* Green matching MMUST theme */
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .tagline {
            font-size: 1.5rem;
            color: #ffcc00; /* Yellow highlight */
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 25px;
            color: #157eca;
            font-size: 1.8rem;
        }

        /* Product Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Product Card */
        .card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 15px;
        }

        .btn {
            background-color: #5c350d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .btn:hover {
            background-color: #121111;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>MMUST SHOP</h1>
        <p class="tagline"><b>Buy & Sell</b></p>
    </header>

    <!-- Main Content Container -->
    <div class="container">
        <h2 class="section-title">Available Products</h2>

        <div class="grid">
            <!-- Product 1: Rim Papers -->
            <div class="card">
                <div class="card-icon">📄</div>
                <h3>Rim Papers</h3>
                <p class="price">KSh 750</p>
                <button class="btn">Buy Now</button>
            </div>

            <!-- Product 2: Pens -->
            <div class="card">
                <div class="card-icon">🖊️</div>
                <h3>Pens</h3>
                <p class="price">KSh 20</p>
                <button class="btn">Buy Now</button>
            </div>

            <!-- Product 3: Exercise Books -->
            <div class="card">
                <div class="card-icon">📚</div>
                <h3>Exercise Books</h3>
                <p class="price">KSh 100</p>
                <button class="btn">Buy Now</button>
            </div>

            <!-- Product 4: Snacks -->
            <div class="card">
                <div class="card-icon">🍿</div>
                <h3>Snacks</h3>
                <p class="price">KSh 50</p>
                <button class="btn">Buy Now</button>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 MMUST SHOP. All Rights Reserved.</p>
    </footer>

</body>
</html>
